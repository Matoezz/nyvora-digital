<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyvora Digital - Member Area</title>
<meta http-equiv="refresh" content="1.5; url=./dashboard/index.html">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6FAF5;
  --dark:#1E4532;
  --lime:#C5E86C;
  --mint:#E8F5E9;
  --border:#E0EBE0;
  --muted:#6B7D6F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-family:'Plus Jakarta Sans',sans-serif;
  color:#0F2418;
}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px 28px;
  max-width:400px;
  width:90%;
  text-align:center;
  box-shadow:0 8px 32px rgba(30,69,50,.08);
  animation:fadeUp .6s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.logo{
  width:48px;height:48px;
  background:var(--dark);
  color:white;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:20px;
  margin:0 auto 14px;
  animation:pop .6s cubic-bezier(.34,1.56,.64,1) .2s both;
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
h1{font-size:18px;margin-bottom:6px}
p{font-size:13px;color:var(--muted);line-height:1.5}
.loader{
  width:100%;height:3px;
  background:var(--mint);
  border-radius:10px;
  overflow:hidden;
  margin:18px 0 14px;
}
.bar{
  height:100%;width:50%;
  background:var(--dark);
  border-radius:10px;
  animation:load 1.5s ease-in-out infinite;
}
@keyframes load{
  0%{transform:translateX(-100%)}
  50%{transform:translateX(100%)}
  100%{transform:translateX(200%)}
}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots span{
  width:6px;height:6px;
  background:var(--dark);
  border-radius:50%;
  opacity:.3;
  animation:bounce 1.4s infinite;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.link{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:var(--dark);color:white;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;text-decoration:none;transition:all .2s}
.link:hover{transform:translateY(-1px);background:#153223}
small{display:block;margin-top:14px;font-size:11px;color:var(--muted)}
</style>
<script>
  // redirect with JS backup (lebih cepat dari meta refresh)
  setTimeout(()=>{ window.location.replace('./dashboard/index.html'); }, 1200);
</script>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1>Nyvora Digital</h1>
    <p>Mengarahkan ke Member Area...</p>
    <div class="loader"><div class="bar"></div></div>
    <div class="dots"><span></span><span></span><span></span></div>
    <a class="link" href="./dashboard/index.html">
      Buka Member Area
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
    </a>
    <small>Akses Aktif Selamanya • v1.0</small>
  </div>
</body>
</html>
